name: Build TOEIC APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Check files
        run: |
          echo "Danh sách file trong repo:"
          find . -maxdepth 3 -type f
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f assets/vocabulary.json
          test -f assets/grammar_part5.json

      - name: Create clean Flutter project
        run: |
          flutter create --platforms=android toeic_build_app

      - name: Copy app source
        run: |
          rm -rf toeic_build_app/lib
          rm -rf toeic_build_app/assets
          cp -r lib toeic_build_app/lib
          cp -r assets toeic_build_app/assets
          cp pubspec.yaml toeic_build_app/pubspec.yaml

      - name: Install dependencies
        working-directory: toeic_build_app
        run: flutter pub get

      - name: Build debug APK
        working-directory: toeic_build_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toeic-app-apk
          path: toeic_build_app/build/app/outputs/flutter-apk/app-debug.apk
