name: Deploy TOEIC Web App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show repository files
        run: |
          echo "Danh sách file hiện tại:"
          find . -maxdepth 3 -type f

      - name: Create pubspec.yaml if missing
        run: |
          if [ ! -f "pubspec.yaml" ]; then
            echo "pubspec.yaml bị thiếu, đang tạo lại..."
            cat > pubspec.yaml <<'EOF'
          name: toeic_flutter_app
          description: TOEIC vocabulary learning app
          publish_to: "none"
          version: 1.0.0+1

          environment:
            sdk: ">=3.3.0 <4.0.0"

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.8
            flutter_tts: ^4.0.2
            shared_preferences: ^2.2.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
            assets:
              - assets/vocabulary.json
              - assets/grammar_part5.json
          EOF
          else
            echo "Đã có pubspec.yaml"
          fi

      - name: Check required files
        run: |
          test -f lib/main.dart
          test -f assets/vocabulary.json
          test -f assets/grammar_part5.json
          test -f pubspec.yaml

      - name: Create clean Flutter web project
        run: |
          flutter create --platforms=web toeic_web_app

      - name: Copy app source
        run: |
          rm -rf toeic_web_app/lib
          rm -rf toeic_web_app/assets
          cp -r lib toeic_web_app/lib
          cp -r assets toeic_web_app/assets
          cp pubspec.yaml toeic_web_app/pubspec.yaml

      - name: Install dependencies
        working-directory: toeic_web_app
        run: flutter pub get

      - name: Build web
        working-directory: toeic_web_app
        run: flutter build web --release --base-href /toeic-flutter-app/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: toeic_web_app/build/web
