name: toeic_flutter_app
description: TOEIC vocabulary learning app converted from Python Tkinter.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.3

flutter:
  uses-material-design: true
  assets:
    - assets/vocabulary.json
    - assets/grammar_part5.json
